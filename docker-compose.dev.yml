services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_agents
      POSTGRES_USER: open_agents
      POSTGRES_PASSWORD: open_agents_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_agents"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
